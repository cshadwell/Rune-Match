<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rune Match</title>
  <style>
    :root { color-scheme:dark; --bg:#0b0f14; --panel:#111823; --ink:#e7eef8; --muted:#9fb0c5; --gold:#f0d58a; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(1200px 700px at 20% 0%,#172437,var(--bg)); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; }
    h1 { margin:0; font-size:clamp(18px,2.4vw,25px); white-space:nowrap; letter-spacing:.3px; }
    .controls { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:7px; }
    button,.download { font:inherit; font-size:13px; font-weight:650; cursor:pointer; border:1px solid #ffffff24; background:#00000030; color:var(--ink); border-radius:10px; padding:9px 12px; text-decoration:none; }
    button:hover,.download:hover { background:#ffffff10; }
    :focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    [hidden] { display:none!important; }
    main { padding:0 10px 10px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(64px,1fr)); grid-auto-rows:minmax(44px,1fr); gap:8px; min-height:calc(100dvh - 66px); }
    button.card { position:relative; width:100%; min-width:0; min-height:44px; padding:0; border:0; background:transparent; perspective:900px; border-radius:12px; }
    .inner { position:absolute; inset:0; border-radius:12px; transform-style:preserve-3d; transition:transform .22s ease; }
    .card.flipped .inner { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:12px; backface-visibility:hidden; border:1px solid #ffffff1a; box-shadow:0 4px 12px #00000035; user-select:none; background:radial-gradient(140px 140px at 30% 20%,#ffffff18,#ffffff05),linear-gradient(#ffffff0d,#00000014); }
    .back { transform:rotateY(180deg); }
    .sigil { width:74%; height:74%; max-width:140px; max-height:140px; }
    .seal { position:absolute; inset:7px; border:1px dashed #ffffff20; border-radius:8px; pointer-events:none; }
    .card.matched .face { border-color:#7cffb28c; box-shadow:0 0 0 1px #7cffb229; }
    .card[aria-disabled="true"] { cursor:default; }
    .saveStatus { margin:0; padding:8px 14px; color:var(--gold); font-size:13px; }
    .saveStatus:empty { display:none; }
    .srOnly { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    dialog { color:var(--ink); background:var(--panel); border:1px solid #ffffff20; border-radius:18px; padding:0; width:min(960px,calc(100% - 24px)); max-height:calc(100dvh - 24px); box-shadow:0 18px 60px #0008; }
    dialog::backdrop { background:#000c; }
    .overlayHead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px; border-bottom:1px solid #ffffff15; position:sticky; top:0; background:var(--panel); z-index:1; }
    h2 { margin:0; color:var(--gold); font-size:clamp(20px,3vw,26px); }
    .overlaySub { margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--muted); }
    .keyFull { padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; }
    .keyTile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1px solid #ffffff15; border-radius:12px; padding:12px; min-height:110px; background:#0003; }
    .L { font-weight:800; font-size:18px; }
    .keyRune { display:block; width:54px; height:54px; }
    .emptyKey { grid-column:1/-1; color:var(--muted); }
    .dialogFoot { padding:0 18px 18px; display:flex; gap:10px; flex-wrap:wrap; }
    #tutorial { width:min(480px,calc(100% - 24px)); padding:24px; }
    #tutorialStep { margin:0 0 8px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    #tutorialText { font-size:16px; line-height:1.65; color:var(--muted); min-height:104px; }
    .tutorialArt { display:flex; justify-content:center; align-items:center; gap:16px; height:130px; margin:16px 0; }
    .tutorialTile { width:100px; height:110px; display:flex; align-items:center; justify-content:center; border:1px solid #ffffff30; border-radius:14px; background:#ffffff08; }
    .tutorialTile .sigil { width:76px; height:76px; }
    .tutorialLetter { font-size:48px; color:var(--gold); }
    .tutorialActions { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .tutorialActions div { display:flex; gap:8px; }
    .primary { background:var(--gold); color:var(--bg); border-color:var(--gold); }
    .primary:hover { background:#ffe5a0; }
    @media(max-width:480px) { header { padding:8px 10px; align-items:flex-start; } h1 { padding-top:7px; } .controls { gap:5px; } button,.download { font-size:12px; padding:8px; } main { padding:0 6px 6px; } .grid { gap:6px; } .seal { inset:5px; } .face,.inner { border-radius:9px; } }
    @media(prefers-reduced-motion:reduce) { .inner { transition:none; } }
  </style>
  <link rel="stylesheet" href="tablet.css?v=aligned-bar-4">
</head>
<body>
  <div class="tabletFrame" aria-hidden="true"></div>
  <div class="borderJewels" aria-hidden="true"><span class="jewel purple" data-gem="purple"></span><span class="jewel yellow" data-gem="yellow"></span><span class="jewel red" data-gem="red"></span><span class="jewel blue" data-gem="blue"></span><span class="jewel green" data-gem="green"></span></div>
  <header id="gameHeader">
    <h1 aria-label="Rune Match"><span class="srOnly">Rune Match</span></h1>
    <div class="controls">
      <button id="viewCipher" type="button">View cipher</button>
      <button id="mute" type="button" aria-pressed="false">Sound on</button>
      <a class="download" id="downloadCipher" href="reference/Rune_Match_Alphabet_Key.svg" download="Rune-Match-Cipher.svg" hidden>Download cipher</a>
    </div>
  </header>
  <p id="saveStatus" role="status" class="saveStatus"></p>
  <p id="feedback" role="status" aria-live="polite" class="srOnly"></p>
  <main><div id="grid" class="grid" aria-label="Matching board"></div></main>
  <dialog id="completeOverlay" aria-labelledby="cipherTitle">
    <div class="overlayHead">
      <div><h2 id="cipherTitle">Cipher</h2><p class="overlaySub">Your discovered letters, ready to decode.</p></div>
      <button id="closeOverlay" type="button" aria-label="Close">Close</button>
    </div>
    <div id="fullKey" class="keyFull"></div>
    <div class="dialogFoot">
      <a class="download" id="downloadCipherDialog" href="reference/Rune_Match_Alphabet_Key.svg" download="Rune-Match-Cipher.svg" hidden>Download cipher</a>
      <button id="howToPlay" type="button">How to play</button>
      <button id="startOver" type="button">Start over</button>
    </div>
  </dialog>
  <dialog id="tutorial" aria-labelledby="tutorialTitle" aria-describedby="tutorialText">
    <p id="tutorialStep"></p><h2 id="tutorialTitle"></h2>
    <div id="tutorialArt" class="tutorialArt" aria-hidden="true"></div>
    <p id="tutorialText"></p>
    <div class="tutorialActions"><button id="skipTutorial" type="button">Skip tutorial</button><div><button id="tutorialBack" type="button">Back</button><button id="tutorialNext" class="primary" type="button">Next</button></div></div>
  </dialog>
  <noscript><p>This matching game needs JavaScript enabled to play.</p></noscript>
  <script src="engine.js"></script><script src="rune-art.js"></script><script src="layout.js?v=aligned-bar-4"></script><script src="app.js?v=aligned-bar-4"></script>
</body>
</html>
